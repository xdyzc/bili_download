<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bili Download</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div class="header-leading">
          <button id="settings-back" class="icon-button" type="button" aria-label="&#36820;&#22238;&#19979;&#36733;" title="&#36820;&#22238;&#19979;&#36733;" hidden>
            <span aria-hidden="true">&#8592;</span>
          </button>
          <div class="header-copy">
            <h1 id="view-title">Bili Download</h1>
            <p id="status">&#26816;&#26597;&#24403;&#21069;&#39029;&#38754;...</p>
          </div>
        </div>
        <button id="settings-open" class="icon-button" type="button" aria-label="&#20219;&#21153;&#19982;&#35774;&#32622;" title="&#20219;&#21153;&#19982;&#35774;&#32622;">
          <span aria-hidden="true">&#9881;</span>
        </button>
      </header>

      <section id="main-view" class="view main-view">
        <section class="panel media-panel">
          <div class="account-row">
            <span>Cookie</span>
            <strong id="account">&#26816;&#26597;&#20013;...</strong>
          </div>

          <label for="title">&#26631;&#39064;</label>
          <input id="title" type="text" readonly>

          <div class="compact-field">
            <label for="bvid">&#35270;&#39057; ID</label>
            <div class="field-row">
              <input id="bvid" type="text" readonly>
              <button id="copy" type="button">&#22797;&#21046;</button>
            </div>
          </div>

          <div class="quality-heading">
            <label for="quality">&#28165;&#26224;&#24230;</label>
            <span id="quality-size" class="quality-size">&#39044;&#35745;&#22823;&#23567;&#65306;--</span>
          </div>
          <select id="quality"></select>
        </section>

        <div class="primary-actions">
          <button id="download" class="primary" type="button">&#19979;&#36733;&#35270;&#39057;</button>
          <button id="download-audio" class="secondary" type="button">&#20165;&#19979;&#36733;&#38899;&#39057;</button>
          <button id="live-record" class="primary action-span" type="button" hidden>&#24320;&#22987;&#24405;&#21046;</button>
        </div>

        <button id="page-picker-toggle" class="secondary page-picker-trigger" type="button" hidden>&#36873;&#25321;&#20998; P</button>
        <section id="page-picker" class="page-picker" hidden>
          <div class="page-picker-head">
            <span>&#20998; P &#21015;&#34920;</span>
            <button id="page-select-all" type="button">&#20840;&#36873;</button>
          </div>
          <div id="page-list" class="page-list"></div>
          <button id="download-selected-pages" class="secondary" type="button">&#19979;&#36733;&#36873;&#20013;&#20998; P</button>
          <button id="download-selected-page-audio" class="secondary" type="button">&#19979;&#36733;&#36873;&#20013;&#38899;&#39057;</button>
        </section>

        <section id="progress" class="progress-panel" hidden>
          <div class="progress-head">
            <span>&#19979;&#36733;&#36827;&#24230;</span>
            <strong id="progress-percent">0%</strong>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div id="progress-bar"></div>
          </div>
          <div class="progress-stats">
            <span id="progress-size">0 B / --</span>
            <span id="progress-speed">--/s</span>
          </div>
          <div id="download-controls" class="progress-actions" hidden>
            <button id="pause" type="button">&#26242;&#20572;</button>
            <button id="cancel" class="danger" type="button">&#21462;&#28040;</button>
          </div>
        </section>
      </section>

      <section id="settings-view" class="view settings-view" hidden>
        <section id="task-center" class="task-center settings-section" aria-label="&#19979;&#36733;&#20219;&#21153;">
          <div class="section-heading task-center-head">
            <div>
              <h2>&#20219;&#21153;&#20013;&#24515;</h2>
              <p id="task-center-note" class="task-center-note">&#27491;&#22312;&#35835;&#21462;&#24403;&#21069;&#39029;&#38754;&#30340;&#20219;&#21153;...</p>
            </div>
            <button id="task-center-refresh" class="icon-button compact-icon" type="button" aria-label="&#21047;&#26032;&#20219;&#21153;" title="&#21047;&#26032;&#20219;&#21153;">
              <span aria-hidden="true">&#8635;</span>
            </button>
          </div>
          <div id="task-list" class="task-list" aria-live="polite"></div>
        </section>

        <details class="safety-settings settings-section">
          <summary>&#20869;&#23384;&#19982;&#24405;&#21046;&#20445;&#25252;</summary>
          <div class="safety-grid">
            <label>DASH &#25991;&#20214;&#19978;&#38480; (MB)
              <input id="dash-max-file-mb" type="number" min="16" max="4096" step="1" inputmode="numeric">
            </label>
            <label>DASH &#20869;&#23384;&#39044;&#31639; (MB)
              <input id="dash-max-memory-mb" type="number" min="128" max="8192" step="1" inputmode="numeric">
            </label>
            <label>&#30452;&#25773;&#26368;&#38271;&#24405;&#21046; (&#20998;&#38047;)
              <input id="live-max-duration-minutes" type="number" min="1" max="720" step="1" inputmode="numeric">
            </label>
            <label>&#30452;&#25773;&#25991;&#20214;&#19978;&#38480; (MB)
              <input id="live-max-file-mb" type="number" min="16" max="4096" step="1" inputmode="numeric">
            </label>
            <label>&#30452;&#25773;&#20869;&#23384;&#39044;&#31639; (MB)
              <input id="live-max-memory-mb" type="number" min="32" max="8192" step="1" inputmode="numeric">
            </label>
          </div>
          <p id="safety-settings-summary" class="safety-note"></p>
          <button id="safety-save" class="settings-save" type="button">&#20445;&#23384;&#20445;&#25252;&#35774;&#32622;</button>
        </details>

        <details class="companion-settings settings-section">
          <summary>&#26412;&#22320;&#27969;&#24335;&#21161;&#25163;</summary>
          <div class="companion-status-row">
            <span id="companion-status" class="companion-status" data-state="unknown">&#23578;&#26410;&#26816;&#27979;</span>
            <button id="companion-check" type="button">&#26816;&#27979;</button>
          </div>
          <label class="companion-option">
            <input id="companion-prefer-dash" type="checkbox">
            <span>&#21333;&#20010; DASH &#20248;&#20808;&#20351;&#29992;&#26412;&#22320;&#21161;&#25163;</span>
          </label>
          <label class="companion-option">
            <input id="companion-prefer-live" type="checkbox">
            <span>&#30452;&#25773;&#24405;&#21046;&#20351;&#29992;&#26412;&#22320;&#21161;&#25163;</span>
          </label>
          <button id="companion-save" class="settings-save" type="button">&#20445;&#23384;&#21161;&#25163;&#20559;&#22909;</button>
          <p class="companion-note">&#36755;&#20986;&#20301;&#32622;&#65306;Videos\BiliDownload</p>
        </details>

        <section class="settings-section diagnostic-settings">
          <div>
            <h2>&#35786;&#26029;</h2>
            <p>&#22797;&#21046;&#26368;&#36817;&#19968;&#27425;&#19979;&#36733;&#30340;&#33073;&#25935;&#35786;&#26029;&#20449;&#24687;&#12290;</p>
          </div>
          <button id="diagnostic" class="secondary" type="button">&#22797;&#21046;&#35786;&#26029;</button>
        </section>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
